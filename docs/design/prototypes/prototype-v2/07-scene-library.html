<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剧灵 - 场景存储库</title>
    <meta name="view-transition" content="same-origin">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">

    <link rel="prefetch" href="04-dashboard.html" as="document">

    <style>
        :root {
            --paper-bg: #F5F1E8;
            --ink-black: #1A1A1A;
            --brand-gold: #C9A962;
            --border-beige: #D3C9B0;
        }

        html { background-color: var(--ink-black); }
        body { margin: 0; padding: 0; overflow-x: hidden; }

        .font-ui { font-family: 'Inter', 'Noto Sans SC', sans-serif; letter-spacing: -0.01em; }
        .font-display { font-family: 'Noto Serif SC', serif; letter-spacing: -0.02em; }

        .paper-texture {
            background-color: var(--paper-bg);
            background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
        }

        @keyframes float-glow {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); filter: drop-shadow(0 0 20px rgba(201, 169, 98, 0.2)); opacity: 0.15; }
            50% { transform: translateY(-40px) rotate(8deg) scale(1.05); filter: drop-shadow(0 0 60px rgba(201, 169, 98, 0.4)); opacity: 0.25; }
        }

        .animate-brand-feather { animation: float-glow 15s ease-in-out infinite; }

        @keyframes breathing-glow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }

        .animate-breathing-glow { animation: breathing-glow 12s ease-in-out infinite; }

        .stagger-in { animation: fade-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        @keyframes fade-up { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        @view-transition { navigation: auto; }
        ::view-transition-old(sidebar), ::view-transition-new(sidebar) { animation: none; mix-blend-mode: normal; }
        ::view-transition-old(brand), ::view-transition-new(brand) { animation: none; mix-blend-mode: normal; }
        ::view-transition-old(main-content) { animation: 0.3s ease-out both fade-out; }
        ::view-transition-new(main-content) { animation: 0.3s ease-in 0.1s both fade-in; }
        @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
            background-blend-mode: soft-light;
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-beige);
            box-shadow: 0 4px 15px -5px rgba(26, 26, 26, 0.05);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--border-beige);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: var(--brand-gold);
        }

        .scene-card-hover:hover .scene-overlay {
            opacity: 1;
        }
    </style>
</head>
<body class="font-ui">
    <div class="min-h-screen flex flex-col md:flex-row bg-white relative">

        <!-- UNIFIED LEFT SIDEBAR -->
        <aside style="view-transition-name: sidebar" class="hidden md:flex md:w-72 lg:w-[20%] xl:w-1/5 bg-[#1A1A1A] flex-col justify-between overflow-hidden relative border-r border-[#2A2A2A]">
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div class="absolute w-[40rem] h-[40rem] bg-[radial-gradient(circle,rgba(201,169,98,0.1)_0%,transparent_70%)] animate-breathing-glow"></div>
                <iconify-icon icon="lucide:feather" class="text-[30rem] text-[#C9A962] opacity-10 animate-brand-feather"></iconify-icon>
            </div>

            <div class="relative z-10 flex flex-col h-full">
                <div class="p-6 lg:p-10" style="view-transition-name: brand">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-[#C9A962] rounded-xl flex items-center justify-center shadow-lg shadow-[#C9A962]/20">
                            <iconify-icon icon="lucide:feather" class="text-2xl text-[#1A1A1A]"></iconify-icon>
                        </div>
                        <span class="font-display text-3xl text-white font-bold tracking-tight">剧灵</span>
                    </div>
                    <p class="text-[10px] text-[#A0A0A0] font-medium mt-3 tracking-[0.4em] uppercase opacity-60">让灵感在剧本中苏醒</p>
                </div>

                <nav class="mt-4 flex-1">
                    <div class="px-4 space-y-1.5">
                        <a href="04-dashboard.html" class="flex items-center gap-4 px-6 py-4 rounded-xl text-white/90 hover:text-white transition-all">
                            <iconify-icon icon="lucide:layout-grid" class="text-xl"></iconify-icon>
                            <span class="font-medium">我的剧本</span>
                        </a>
                        <a href="09-character-management.html" class="flex items-center gap-4 px-6 py-4 rounded-xl text-[#A0A0A0] hover:text-white hover:bg-white/5 transition-all">
                            <iconify-icon icon="lucide:users" class="text-xl"></iconify-icon>
                            <span class="font-medium">人物管理</span>
                        </a>
                        <a href="#" class="flex items-center gap-4 px-6 py-4 rounded-xl text-[#A0A0A0] hover:text-white hover:bg-white/5 transition-all">
                            <iconify-icon icon="lucide:book-open" class="text-xl"></iconify-icon>
                            <span class="font-medium">作品文库</span>
                        </a>
                        <a href="#" class="flex items-center gap-4 px-6 py-4 rounded-xl text-[#A0A0A0] hover:text-white hover:bg-white/5 transition-all">
                            <iconify-icon icon="lucide:sparkles" class="text-xl"></iconify-icon>
                            <span class="font-medium">灵感工坊</span>
                        </a>
                        <a href="#" class="flex items-center gap-4 px-6 py-4 rounded-xl text-[#A0A0A0] hover:text-white hover:bg-white/5 transition-all">
                            <iconify-icon icon="lucide:database" class="text-xl"></iconify-icon>
                            <span class="font-medium">素材管理</span>
                        </a>
                    </div>
                </nav>

                <div class="p-6 lg:p-10 border-t border-white/5 bg-gradient-to-t from-black/40 to-transparent">
                    <h2 class="font-display text-sm text-white/50 leading-relaxed italic">
                        "像作家一样思考，<br/>像艺术家一样感受。"
                    </h2>
                </div>
            </div>
        </aside>

        <!-- RIGHT: SCENE LIBRARY AREA -->
        <main style="view-transition-name: main-content" class="flex-1 paper-texture flex flex-col min-h-screen relative overflow-hidden">

            <div class="md:hidden p-6 flex items-center gap-4 border-b border-[#D3C9B0]/50 bg-white/30">
                <div class="w-10 h-10 bg-[#C9A962] rounded-xl flex items-center justify-center">
                    <iconify-icon icon="lucide:feather" class="text-xl text-[#1A1A1A]"></iconify-icon>
                </div>
                <span class="font-display text-2xl text-white font-bold">剧灵</span>
            </div>

            <!-- Header -->
            <header class="h-16 w-full bg-white/80 backdrop-blur-sm border-b border-[#D3C9B0] px-6 flex items-center justify-between z-10">
                <div class="flex items-center gap-4">
                    <a href="04-dashboard.html" class="p-2 text-[#5C5548] hover:text-[#C9A962] transition-colors">
                        <iconify-icon icon="lucide:arrow-left" class="text-xl"></iconify-icon>
                    </a>
                    <div class="flex items-center gap-3">
                        <h1 class="text-xl font-display font-bold text-[#1A1A1A]">场景存储库</h1>
                        <span class="px-2 py-0.5 bg-[#C9A962]/10 text-[#C9A962] text-[10px] font-bold rounded uppercase tracking-wider">Scenes</span>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <div class="hidden md:flex items-center gap-1 bg-white/50 border border-[#D3C9B0] rounded-lg px-2 py-1">
                        <iconify-icon icon="lucide:search" class="text-[#8B7355] text-lg"></iconify-icon>
                        <input type="text" placeholder="搜索场景..." class="bg-transparent border-none text-xs outline-none w-24 focus:w-40 transition-all text-[#1A1A1A]">
                    </div>
                    <button class="p-2 text-[#5C5548] hover:text-[#C9A962] transition-colors">
                        <iconify-icon icon="lucide:filter" class="text-xl"></iconify-icon>
                    </button>
                    <button class="px-4 py-2 bg-[#C9A962] text-white rounded-lg text-xs font-bold hover:bg-[#A68A45] transition-all flex items-center gap-2 shadow-sm">
                        <iconify-icon icon="lucide:plus"></iconify-icon>
                        新建场景
                    </button>
                </div>
            </header>

            <!-- Scene Content -->
            <div class="flex-1 overflow-y-auto custom-scrollbar p-6 md:p-8">
                <div class="max-w-7xl mx-auto">
                    <!-- Scene Categories -->
                    <div class="mb-8">
                        <div class="flex items-center gap-2 mb-4">
                            <span class="w-1.5 h-1.5 rounded-full bg-[#C9A962]"></span>
                            <h3 class="text-xs font-bold text-[#8B7355] uppercase tracking-[0.2em]">场景分类</h3>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            <button class="px-4 py-2 bg-[#C9A962] text-white rounded-lg text-xs font-semibold">全部场景</button>
                            <button class="px-4 py-2 bg-white border border-[#D3C9B0] text-[#5C5548] rounded-lg text-xs font-medium hover:border-[#C9A962] hover:text-[#C9A962] transition-all">室外场景</button>
                            <button class="px-4 py-2 bg-white border border-[#D3C9B0] text-[#5C5548] rounded-lg text-xs font-medium hover:border-[#C9A962] hover:text-[#C9A962] transition-all">室内场景</button>
                            <button class="px-4 py-2 bg-white border border-[#D3C9B0] text-[#5C5548] rounded-lg text-xs font-medium hover:border-[#C9A962] hover:text-[#C9A962] transition-all">特殊场景</button>
                        </div>
                    </div>

                    <!-- Scene Cards Grid -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                        <!-- Scene Card 1 -->
                        <div class="scene-card-hover group relative aspect-[4/3] bg-white border border-[#D3C9B0] rounded-lg overflow-hidden cursor-pointer shadow-sm stagger-in">
                            <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>

                            <div class="scene-overlay absolute top-4 right-4 opacity-0 transition-opacity">
                                <button class="w-10 h-10 bg-[#C9A962] text-white rounded-full flex items-center justify-center shadow-lg hover:bg-[#A68A45] transition-all">
                                    <iconify-icon icon="lucide:edit-2" class="text-lg"></iconify-icon>
                                </button>
                            </div>

                            <div class="absolute bottom-0 left-0 right-0 p-4">
                                <div class="flex items-center gap-2 mb-2">
                                    <iconify-icon icon="lucide:map-pin" class="text-[#C9A962] text-sm"></iconify-icon>
                                    <span class="text-[10px] text-white/70 font-bold uppercase tracking-widest">室外</span>
                                </div>
                                <h3 class="font-display text-white font-bold text-lg">湘西山区</h3>
                                <p class="text-xs text-white/60 line-clamp-1 mt-1">月黑风高，雾气如潮水般在密林中翻涌</p>
                            </div>
                        </div>

                        <!-- Scene Card 2 -->
                        <div class="scene-card-hover group relative aspect-[4/3] bg-white border border-[#D3C9B0] rounded-lg overflow-hidden cursor-pointer shadow-sm stagger-in" style="animation-delay: 0.05s;">
                            <img src="https://images.unsplash.com/photo-1534067783941-51c9c23ecefd?auto=format&fit=crop&w=600&q=80" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>

                            <div class="scene-overlay absolute top-4 right-4 opacity-0 transition-opacity">
                                <button class="w-10 h-10 bg-[#C9A962] text-white rounded-full flex items-center justify-center shadow-lg hover:bg-[#A68A45] transition-all">
                                    <iconify-icon icon="lucide:edit-2" class="text-lg"></iconify-icon>
                                </button>
                            </div>

                            <div class="absolute bottom-0 left-0 right-0 p-4">
                                <div class="flex items-center gap-2 mb-2">
                                    <iconify-icon icon="lucide:home" class="text-[#C9A962] text-sm"></iconify-icon>
                                    <span class="text-[10px] text-white/70 font-bold uppercase tracking-widest">室内</span>
                                </div>
                                <h3 class="font-display text-white font-bold text-lg">盛家古宅</h3>
                                <p class="text-xs text-white/60 line-clamp-1 mt-1">深山之中的吊脚楼群，常年被迷雾笼罩</p>
                            </div>
                        </div>

                        <!-- Scene Card 3 -->
                        <div class="scene-card-hover group relative aspect-[4/3] bg-white border border-[#D3C9B0] rounded-lg overflow-hidden cursor-pointer shadow-sm stagger-in" style="animation-delay: 0.1s;">
                            <img src="https://images.unsplash.com/photo-1542281286-9e0a16bb7366?auto=format&fit=crop&w=600&q=80" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>

                            <div class="scene-overlay absolute top-4 right-4 opacity-0 transition-opacity">
                                <button class="w-10 h-10 bg-[#C9A962] text-white rounded-full flex items-center justify-center shadow-lg hover:bg-[#A68A45] transition-all">
                                    <iconify-icon icon="lucide:edit-2" class="text-lg"></iconify-icon>
                                </button>
                            </div>

                            <div class="absolute bottom-0 left-0 right-0 p-4">
                                <div class="flex items-center gap-2 mb-2">
                                    <iconify-icon icon="lucide:home" class="text-[#C9A962] text-sm"></iconify-icon>
                                    <span class="text-[10px] text-white/70 font-bold uppercase tracking-widest">室内</span>
                                </div>
                                <h3 class="font-display text-white font-bold text-lg">万寿宫大厅</h3>
                                <p class="text-xs text-white/60 line-clamp-1 mt-1">宗族议事之所，庄严肃穆的木质结构大厅</p>
                            </div>
                        </div>

                        <!-- Add New Scene Card -->
                        <button class="aspect-[4/3] border-2 border-dashed border-[#D3C9B0] rounded-lg bg-white/40 hover:bg-white/60 hover:border-[#C9A962] transition-all flex flex-col items-center justify-center group stagger-in" style="animation-delay: 0.15s;">
                            <div class="w-12 h-12 rounded-full bg-white border border-[#D3C9B0] flex items-center justify-center text-[#D3C9B0] group-hover:text-[#C9A962] group-hover:border-[#C9A962] transition-colors">
                                <iconify-icon icon="lucide:plus" class="text-2xl"></iconify-icon>
                            </div>
                            <span class="mt-4 text-sm font-bold text-[#8B7355] group-hover:text-[#1A1A1A]">新建场景</span>
                            <span class="mt-1 text-[10px] text-gray-400">室外 / 室内 / 特殊</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right Sidebar: Scene Stats -->
            <aside class="hidden xl:flex w-72 border-l border-[#D3C9B0] bg-white/50 backdrop-blur-md flex-col">
                <div class="p-6 border-b border-[#D3C9B0]/50 flex items-center justify-between">
                    <h3 class="text-xs font-bold text-[#1A1A1A] tracking-widest uppercase">场景统计</h3>
                    <iconify-icon icon="lucide:bar-chart-2" class="text-[#C9A962] text-xl"></iconify-icon>
                </div>
                <div class="flex-1 p-6 space-y-6">
                    <div class="p-4 bg-white border border-[#D3C9B0]/50 rounded-lg">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-bold text-[#5C5548]">总场景数</span>
                            <span class="text-2xl font-display font-bold text-[#1A1A1A]">12</span>
                        </div>
                        <div class="space-y-2">
                            <div class="flex justify-between text-[11px]">
                                <span class="text-[#8B7355]">室外场景</span>
                                <span class="font-bold text-[#1A1A1A]">7</span>
                            </div>
                            <div class="flex justify-between text-[11px]">
                                <span class="text-[#8B7355]">室内场景</span>
                                <span class="font-bold text-[#1A1A1A]">5</span>
                            </div>
                        </div>
                    </div>
                    <div class="p-4 bg-white border border-[#D3C9B0]/50 rounded-lg">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-bold text-[#5C5548]">使用频率</span>
                        </div>
                        <div class="space-y-3">
                            <div class="flex items-center gap-2">
                                <span class="text-[11px] text-[#8B7355] flex-1">湘西山区</span>
                                <div class="w-16 h-1 bg-[#F5F1E8] rounded-full overflow-hidden">
                                    <div class="h-full bg-[#C9A962] w-[80%]"></div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-[11px] text-[#8B7355] flex-1">盛家古宅</span>
                                <div class="w-16 h-1 bg-[#F5F1E8] rounded-full overflow-hidden">
                                    <div class="h-full bg-[#C9A962] w-[60%]"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="p-4 border-t border-[#D3C9B0] bg-[#FAF7F0]">
                    <div class="relative">
                        <input type="text" placeholder="询问 AI 场景建议..." class="w-full pl-3 pr-10 py-2.5 bg-white border border-[#D3C9B0] rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-[#C9A962]">
                        <button class="absolute right-2 top-2 p-1 text-[#C9A962]"><iconify-icon icon="lucide:send-horizontal"></iconify-icon></button>
                    </div>
                </div>
            </aside>
        </main>
    </div>
</body>
</html>
