<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剧灵 - 世界观核心设定</title>
    <meta name="view-transition" content="same-origin">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="js/ai-chat.js"></script>
    <script src="js/modal.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@600;700&family=Courier+Prime:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --paper-bg: #F5F1E8;
            --white-bg: #FFFFFF;
            --brand-gold: #C9A962;
            --brand-gold-dark: #A68A45;
            --text-main: #1A1A1A;
            --text-sub: #5C5548;
            --text-muted: #8B7355;
            --border-color: #D3C9B0;
            --hover-bg: #FAF7F0;
        }

        .font-ui {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
        }

        .font-display {
            font-family: 'Noto Serif SC', serif;
        }

        .paper-texture {
            background-color: var(--paper-bg);
            background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .sidebar-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-left-collapsed {
            width: 0 !important;
            min-width: 0 !important;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-20px);
        }

        .sidebar-right-collapsed {
            width: 0 !important;
            min-width: 0 !important;
            opacity: 0;
            pointer-events: none;
            transform: translateX(20px);
        }

        .integrated-sidebar {
            background: white;
            border-right: 1px solid var(--border-color);
            position: relative;
            z-index: 30;
            height: 100vh;
        }

        .integrated-sidebar-right {
            border-right: none;
            border-left: 1px solid var(--border-color);
        }

        .edge-toggle {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            width: 1.25rem;
            height: 4rem;
            background: white;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .edge-toggle:hover {
            background: var(--hover-bg);
            color: var(--brand-gold);
            border-color: var(--brand-gold);
        }

        .toggle-left-edge {
            left: 0;
            border-radius: 0 0.5rem 0.5rem 0;
            border-left: none;
        }

        .toggle-right-edge {
            right: 0;
            border-radius: 0.5rem 0 0 0.5rem;
            border-right: none;
        }

        .content-area {
            flex: 1;
            padding: 2.5rem;
            overflow-y: auto;
        }

        @view-transition {
            navigation: auto;
        }
    </style>
</head>

<body class="h-screen flex overflow-hidden font-ui">

    <!-- Edge Toggles -->
    <button onclick="toggleSidebar('left')" class="edge-toggle toggle-left-edge">
        <iconify-icon id="icon-toggle-left" icon="lucide:chevron-left" class="text-sm"></iconify-icon>
    </button>
    <button onclick="toggleSidebar('right')" class="edge-toggle toggle-right-edge">
        <iconify-icon id="icon-toggle-right" icon="lucide:chevron-right" class="text-sm"></iconify-icon>
    </button>

    <!-- Left Sidebar: Unified Navigation -->
    <aside id="sidebar-left"
        class="integrated-sidebar w-64 lg:w-72 shrink-0 flex flex-col sidebar-transition overflow-hidden">
        <a href="00-welcome.html"
            class="p-6 border-b border-[#D3C9B0]/50 flex items-center gap-3 hover:opacity-80 transition-opacity">
            <div class="w-8 h-8 bg-[#1A1A1A] rounded flex items-center justify-center">
                <img src="https://api.iconify.design/lucide/feather.svg?color=%23C9A962&width=64&height=64&box=1A1A1A"
                    class="w-5 h-5" alt="Logo">
            </div>
            <div class="flex flex-col -gap-1">
                <span class="font-display font-bold text-2xl tracking-tighter text-[#1A1A1A]">剧灵</span>
                <span
                    class="text-[8px] font-bold text-[#C9A962] tracking-widest uppercase -mt-1 opacity-70">scripter.art</span>
            </div>
        </a>

        <nav class="flex-1 py-4 px-3 space-y-1 overflow-y-auto custom-scrollbar">
            <!-- Global 6 Items -->
            <a href="01-dashboard.html"
                class="flex items-center gap-3 px-3 py-2.5 rounded text-[#5C5548] hover:bg-[#FAF7F0] transition-colors group">
                <iconify-icon icon="lucide:layout-dashboard" class="text-xl"></iconify-icon>
                <span class="text-sm font-medium">控制台</span>
            </a>
            <a href="02-editor.html"
                class="flex items-center gap-3 px-3 py-2.5 rounded text-[#5C5548] hover:bg-[#FAF7F0] transition-colors group">
                <iconify-icon icon="lucide:scroll" class="text-xl"></iconify-icon>
                <span class="text-sm font-medium">剧本</span>
            </a>
            <a href="03-characters.html"
                class="flex items-center gap-3 px-3 py-2.5 rounded text-[#5C5548] hover:bg-[#FAF7F0] transition-colors group">
                <iconify-icon icon="lucide:users" class="text-xl"></iconify-icon>
                <span class="text-sm font-medium">人物</span>
            </a>
            <a href="05-scenes.html"
                class="flex items-center gap-3 px-3 py-2.5 rounded text-[#5C5548] hover:bg-[#FAF7F0] transition-colors group">
                <iconify-icon icon="lucide:clapperboard" class="text-xl"></iconify-icon>
                <span class="text-sm font-medium">场景</span>
            </a>
            <a href="04-worldview.html"
                class="flex items-center gap-3 px-3 py-2.5 rounded bg-[#FAF7F0] text-[#C9A962] font-semibold border-r-4 border-[#C9A962] rounded-r-none">
                <iconify-icon icon="lucide:globe" class="text-xl"></iconify-icon>
                <span class="text-sm">世界观</span>
            </a>
            <a href="06-storyboard.html"
                class="flex items-center gap-3 px-3 py-2.5 rounded text-[#5C5548] hover:bg-[#FAF7F0] transition-colors group">
                <iconify-icon icon="lucide:layout" class="text-xl"></iconify-icon>
                <span class="text-sm font-medium">分镜</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 h-full flex flex-col paper-texture overflow-hidden">
        <header class="h-16 bg-white/80 border-b border-[#D3C9B0] flex items-center justify-between px-8 z-10 shrink-0">
            <h1 class="font-display font-bold text-lg text-[#1A1A1A]">世界观设定</h1>
            <button
                class="px-5 py-1.5 border border-[#D3C9B0] rounded text-xs font-bold transition-all hover:bg-white">导出设定集</button>
        </header>

        <div class="content-area custom-scrollbar">
            <div class="max-w-6xl mx-auto">
                <section class="bg-white border border-[#D3C9B0] p-12 rounded-sm relative shadow-sm">
                    <h2 class="font-display font-bold text-4xl mb-6 text-[#1A1A1A]">湘西民国秘史</h2>
                    <p class="text-base text-[#5C5548] leading-relaxed italic max-w-2xl">“那片被群山环绕的幽邃之地，生与死的边界模糊不清。”</p>
                    <iconify-icon icon="lucide:globe"
                        class="absolute -right-10 -bottom-10 text-[200px] text-[#C9A962]/5"></iconify-icon>
                </section>
            </div>
        </div>
    </main>

    <!-- Right Sidebar: Unified AI Assistant -->
    <aside id="sidebar-right"
        class="integrated-sidebar integrated-sidebar-right w-80 shrink-0 flex flex-col sidebar-transition overflow-hidden">
        <!-- User Profile Header -->
        <div class="p-6 border-b border-[#D3C9B0]/50 bg-white">
            <div
                class="flex items-center justify-between p-2 rounded hover:bg-[#FAF7F0] transition-colors cursor-pointer group">
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=100"
                            class="w-9 h-9 rounded-full object-cover border border-[#D3C9B0]">
                        <div
                            class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-500 border-2 border-white rounded-full">
                        </div>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-xs font-bold text-[#1A1A1A]">Felix Vincent</span>
                        <div class="flex items-center gap-1.5">
                            <span
                                class="text-[9px] text-[#C9A962] font-black uppercase tracking-widest bg-[#C9A962]/10 px-1 rounded">Pro</span>
                            <span class="text-[9px] text-[#8B7355]">编剧资深会员</span>
                        </div>
                    </div>
                </div>
                <button onclick="openSettingsModal()" class="text-gray-300 group-hover:text-[#1A1A1A] transition-colors">
                    <iconify-icon icon="lucide:settings"></iconify-icon>
                </button>
            </div>
        </div>

        <!-- AI Chat Container -->
        <div id="ai-chat-container" class="flex flex-col flex-1 overflow-hidden">
            <!-- AI chat will be rendered here by ai-chat.js -->
        </div>
    </aside>

    <script>
        function toggleSidebar(side) {
            const sidebar = document.getElementById(`sidebar-${side}`);
            const icon = document.getElementById(`icon-toggle-${side}`);
            const isCollapsed = sidebar.classList.toggle(`sidebar-${side}-collapsed`);

            if (side === 'left') {
                icon.setAttribute('icon', isCollapsed ? 'lucide:chevron-right' : 'lucide:chevron-left');
            } else {
                icon.setAttribute('icon', isCollapsed ? 'lucide:chevron-left' : 'lucide:chevron-right');
            }
        }

        // Initialize AI Chat on page load
        document.addEventListener('DOMContentLoaded', () => {
            const aiChat = new ScripterAIChat({
                container: document.getElementById('ai-chat-container')
            });
        });
    </script>
</body>

</html>
