<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剧灵 - 人物档案库</title>
    <meta name="view-transition" content="same-origin">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="js/ai-chat.js"></script>
    <script src="js/modal.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@600;700&family=Courier+Prime:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --paper-bg: #F5F1E8;
            --white-bg: #FFFFFF;
            --brand-gold: #C9A962;
            --brand-gold-dark: #A68A45;
            --text-main: #1A1A1A;
            --text-sub: #5C5548;
            --text-muted: #8B7355;
            --border-color: #D3C9B0;
            --hover-bg: #FAF7F0;
        }

        .font-ui {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
        }

        .font-display {
            font-family: 'Noto Serif SC', serif;
        }

        .paper-texture {
            background-color: var(--paper-bg);
            background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .sidebar-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-left-collapsed {
            width: 0 !important;
            min-width: 0 !important;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-20px);
        }

        .sidebar-right-collapsed {
            width: 0 !important;
            min-width: 0 !important;
            opacity: 0;
            pointer-events: none;
            transform: translateX(20px);
        }

        .integrated-sidebar {
            background: #1A1A1A;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 30;
            height: 100vh;
        }

        .integrated-sidebar-right {
            border-right: none;
            border-left: 1px solid var(--border-color);
        }

        /* Navigation link styles for dark sidebar */
        .integrated-sidebar a {
            color: #FFFFFF;
        }
        .integrated-sidebar a:hover {
            color: #C9A962;
            background: rgba(255, 255, 255, 0.05);
        }

        /* v2 Visual Effects - Animations */
        @keyframes float-glow {
            0%, 100% {
                transform: translateY(0) rotate(0deg) scale(1);
                filter: drop-shadow(0 0 20px rgba(201, 169, 98, 0.2));
                opacity: 0.15;
            }
            50% {
                transform: translateY(-40px) rotate(8deg) scale(1.05);
                filter: drop-shadow(0 0 60px rgba(201, 169, 98, 0.4));
                opacity: 0.25;
            }
        }

        .animate-brand-feather {
            animation: float-glow 15s ease-in-out infinite;
        }

        @keyframes breathing-glow {
            0%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.1);
            }
        }

        .animate-breathing-glow {
            animation: breathing-glow 12s ease-in-out infinite;
        }

        /* Active navigation state */
        .nav-item.active {
            background: rgba(201, 169, 98, 0.12);
            border-left: 3px solid var(--brand-gold);
            color: var(--brand-gold);
        }

        /* Sidebar decorative background */
        .sidebar-decoration {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            overflow: hidden;
        }

        .sidebar-glow {
            position: absolute;
            width: 40rem;
            height: 40rem;
            background: radial-gradient(circle, rgba(201, 169, 98, 0.1) 0%, transparent 70%);
            animation: breathing-glow 12s ease-in-out infinite;
        }

        .sidebar-feather {
            font-size: 30rem;
            color: #C9A962;
            opacity: 0.1;
            animation: float-glow 15s ease-in-out infinite;
        }

        .edge-toggle {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            width: 1.25rem;
            height: 4rem;
            background: white;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .edge-toggle:hover {
            background: var(--hover-bg);
            color: var(--brand-gold);
            border-color: var(--brand-gold);
        }

        .toggle-left-edge {
            left: 0;
            border-radius: 0 0.5rem 0.5rem 0;
            border-left: none;
        }

        .toggle-right-edge {
            right: 0;
            border-radius: 0.5rem 0 0 0.5rem;
            border-right: none;
        }

        .content-area {
            flex: 1;
            padding: 2.5rem;
            overflow-y: auto;
        }

        .char-card-flat {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .char-card-flat:hover {
            border-color: var(--brand-gold);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        @view-transition {
            navigation: auto;
        }
    </style>
</head>

<body class="h-screen flex overflow-hidden font-ui">

    <!-- Edge Toggles -->
    <button onclick="toggleSidebar('left')" class="edge-toggle toggle-left-edge">
        <iconify-icon id="icon-toggle-left" icon="lucide:chevron-left" class="text-sm"></iconify-icon>
    </button>
    <button onclick="toggleSidebar('right')" class="edge-toggle toggle-right-edge">
        <iconify-icon id="icon-toggle-right" icon="lucide:chevron-right" class="text-sm"></iconify-icon>
    </button>

    <!-- Left Sidebar: Unified Navigation -->
    <aside id="sidebar-left"
        class="integrated-sidebar w-64 lg:w-72 shrink-0 flex flex-col sidebar-transition overflow-hidden relative">
        <!-- Decorative Background -->
        <div class="sidebar-decoration">
            <div class="sidebar-glow"></div>
            <iconify-icon icon="lucide:feather" class="sidebar-feather animate-brand-feather"></iconify-icon>
        </div>

        <!-- Content with higher z-index -->
        <div class="relative z-10 flex flex-col h-full">
            <a href="00-welcome.html"
                class="p-6 border-b border-white/10 flex items-center gap-3 hover:opacity-80 transition-opacity">
                <div class="w-8 h-8 bg-[#1A1A1A] rounded flex items-center justify-center">
                    <img src="https://api.iconify.design/lucide/feather.svg?color=%23C9A962&width=64&height=64&box=1A1A1A"
                        class="w-5 h-5" alt="Logo">
                </div>
                <div class="flex flex-col -gap-1">
                    <span class="font-display font-bold text-2xl tracking-tighter text-[#1A1A1A]">剧灵</span>
                    <span
                        class="text-[8px] font-bold text-[#C9A962] tracking-widest uppercase -mt-1 opacity-70">scripter.art</span>
                </div>
            </a>

            <nav class="flex-1 py-4 px-3 space-y-1 overflow-y-auto custom-scrollbar">
                <a href="01-dashboard.html"
                    class="nav-item flex items-center gap-4 px-6 py-4 rounded-xl text-white/50 hover:text-white hover:bg-white/5 transition-all group">
                    <iconify-icon icon="lucide:layout-dashboard" class="text-xl"></iconify-icon>
                    <span class="text-sm font-medium">控制台</span>
                </a>
                <a href="02-editor.html"
                    class="nav-item flex items-center gap-4 px-6 py-4 rounded-xl text-white/50 hover:text-white hover:bg-white/5 transition-all group">
                    <iconify-icon icon="lucide:scroll" class="text-xl"></iconify-icon>
                    <span class="text-sm font-medium">剧本</span>
                </a>
                <a href="03-characters.html"
                    class="nav-item active flex items-center gap-4 px-6 py-4 rounded-xl text-white/90 transition-all group">
                    <iconify-icon icon="lucide:users" class="text-xl"></iconify-icon>
                    <span class="text-sm font-medium">人物</span>
                </a>
                <a href="05-scenes.html"
                    class="nav-item flex items-center gap-4 px-6 py-4 rounded-xl text-white/50 hover:text-white hover:bg-white/5 transition-all group">
                    <iconify-icon icon="lucide:clapperboard" class="text-xl"></iconify-icon>
                    <span class="text-sm font-medium">场景</span>
                </a>
                <a href="04-worldview.html"
                    class="nav-item flex items-center gap-4 px-6 py-4 rounded-xl text-white/50 hover:text-white hover:bg-white/5 transition-all group">
                    <iconify-icon icon="lucide:globe" class="text-xl"></iconify-icon>
                    <span class="text-sm font-medium">世界观</span>
                </a>
                <a href="06-storyboard.html"
                    class="nav-item flex items-center gap-4 px-6 py-4 rounded-xl text-white/50 hover:text-white hover:bg-white/5 transition-all group">
                    <iconify-icon icon="lucide:layout" class="text-xl"></iconify-icon>
                    <span class="text-sm font-medium">分镜</span>
                </a>
            </nav>

            <div
                class="p-4 border-t border-white/5 text-[10px] text-white/50 font-bold text-center uppercase tracking-widest bg-gradient-to-t from-black/40 to-transparent">
                v4.6 UNIFIED EDITION
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 h-full flex flex-col paper-texture overflow-hidden">
        <header class="h-16 bg-white/80 border-b border-[#D3C9B0] flex items-center justify-between px-8 z-10 shrink-0">
            <h1 class="font-display font-bold text-lg text-[#1A1A1A]">人物档案库</h1>
            <button class="px-5 py-1.5 bg-[#1A1A1A] text-white rounded text-xs font-bold transition-all">创建新角色</button>
        </header>

        <div class="content-area custom-scrollbar">
            <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <div class="char-card-flat rounded overflow-hidden cursor-pointer group flex flex-col">
                    <div class="aspect-[3/4] relative overflow-hidden bg-gray-100 border-b border-[#D3C9B0]">
                        <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&q=80&w=800"
                            class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-700"
                            alt="Character">
                        <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-[#1A1A1A] p-6">
                            <h2 class="text-2xl font-display font-bold text-white">雾姝</h2>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Right Sidebar: Unified AI Assistant -->
    <aside id="sidebar-right"
        class="integrated-sidebar integrated-sidebar-right w-80 shrink-0 flex flex-col sidebar-transition overflow-hidden">
        <!-- User Profile Header -->
        <div class="p-6 border-b border-[#D3C9B0]/50 bg-white">
            <div
                class="flex items-center justify-between p-2 rounded hover:bg-[#FAF7F0] transition-colors cursor-pointer group">
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=100"
                            class="w-9 h-9 rounded-full object-cover border border-[#D3C9B0]">
                        <div
                            class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-500 border-2 border-white rounded-full">
                        </div>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-xs font-bold text-[#1A1A1A]">Felix Vincent</span>
                        <div class="flex items-center gap-1.5">
                            <span
                                class="text-[9px] text-[#C9A962] font-black uppercase tracking-widest bg-[#C9A962]/10 px-1 rounded">Pro</span>
                            <span class="text-[9px] text-[#8B7355]">编剧资深会员</span>
                        </div>
                    </div>
                </div>
                <button onclick="openSettingsModal()" class="text-gray-300 group-hover:text-[#1A1A1A] transition-colors">
                    <iconify-icon icon="lucide:settings"></iconify-icon>
                </button>
            </div>
        </div>

        <!-- AI Chat Container -->
        <div id="ai-chat-container" class="flex flex-col flex-1 overflow-hidden">
            <!-- AI chat will be rendered here by ai-chat.js -->
        </div>
    </aside>

    <script>
        function toggleSidebar(side) {
            const sidebar = document.getElementById(`sidebar-${side}`);
            const icon = document.getElementById(`icon-toggle-${side}`);
            const isCollapsed = sidebar.classList.toggle(`sidebar-${side}-collapsed`);

            if (side === 'left') {
                icon.setAttribute('icon', isCollapsed ? 'lucide:chevron-right' : 'lucide:chevron-left');
            } else {
                icon.setAttribute('icon', isCollapsed ? 'lucide:chevron-left' : 'lucide:chevron-right');
            }
        }

        // Initialize AI Chat on page load
        document.addEventListener('DOMContentLoaded', () => {
            const aiChat = new ScripterAIChat({
                container: document.getElementById('ai-chat-container')
            });
        });
    </script>
</body>

</html>
