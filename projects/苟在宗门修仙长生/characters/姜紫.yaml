## 与主角的关系

### 初识（第31-40集）

**初次见面**：
- 外门大比后，高平阳进入内门
- 姜紫作为三师姐，赠送黄龙丹
- "师姐备了一枚黄龙丹，愿助师弟早日练气圆满。"
- 对高平阳的第一印象：稳健、努力

**初步关注**：
- 关注高平阳的修炼进展
- 欣赏他的稳健和努力
- "五灵根资质能到练气大圆满，实属不易"
- 开始认可这个师弟

### 发展（第41-50集）

**代掌事务**：
- 师尊闭关，姜紫代掌事务
- 高平阳来求取筑基丹
- 姜紫爽快给予，"师尊闭关前有交代"
- 对高平阳更加欣赏

**亦师亦友**：
- 指导高平阳修炼
- 分享丹道心得
- "师弟若有丹道疑惑，可来寻师姐"
- 关系逐渐亲近

### 深化（第51-80集）

**并肩作战**：
- 宗门大战，并肩对抗敌对宗门
- 互相配合，默契十足
- 姜紫负责炼丹支援
- 高平阳负责前线战斗

**共同成长**：
- 姜紫突破筑基大圆满
- 高平阳突破金丹
- 互相鼓励，共同进步
- "师弟的进步，师姐看在眼里"

**信任盟友**：
- 成为高平阳在内门的重要盟友
- 信任彼此，互相支持
- "师姐相信师弟"
- "师弟若有需要，师姐必相助"

### 核心互动场景

**场景1：赠送黄龙丹（第40集）**
- 姜紫："师姐备了一枚黄龙丹，愿助师弟早日练气圆满。"
- 高平阳："多谢师姐！"
- 姜紫微微颔首，轻移莲步离去

**场景2：给予筑基丹（第50集）**
- 高平阳："师姐，师尊何时出关？弟子欲求筑基丹。"
- 姜紫："师尊闭关前有交代，这是你的筑基丹。"
- 高平阳深深一礼："平阳，谢过师姐，谢过师尊！"

**场景3：丹道指导（第60集）**
- 高平阳："师姐，弟子对丹道颇有疑惑。"
- 姜紫："师弟说来，师姐知无不言。"
- 详细讲解丹道要义，高平阳受益匪浅

**场景4：宗门大战（第70集）**
- 姜紫："师弟，此战凶险，多保重。"
- 高平阳："师姐也保重。"
- 互相点头，奔赴战场

