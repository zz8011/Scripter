## 人物总结

**姜紫**是一个重要配角：
- ✅ 清冷高傲，但不狂妄
- ✅ 面冷心热，真诚待人
- ✅ 丹道天才，实力强大
- ✅ 慧眼识人，欣赏努力
- ✅ 优雅从容，气质出尘

**角色定位**：
- 重要配角（第31-80集）
- 高平阳在内门的盟友
- 丹道导师和帮助者
- 代表"不以资质取人"的正面形象

**核心作用**：
- 帮助主角：赠送丹药，指导修炼
- 体现主题：努力和稳健比天赋更重要
- 情感支撑：在内门给予主角温暖
- 战力支援：宗门大战时炼丹支援

**观众定位**：
- 让人喜爱的正面角色
- 清冷仙子型角色
- 观众期待与主角有更多互动
- "师姐太好了！"

