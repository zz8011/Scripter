# 角色小传：许青松

## 基本信息

**姓名**：许青松

**年龄**：180岁（金丹期，寿元约500年）

**身份**：
- 青阳宗金丹期长老
- 高平阳的师父（师尊）
- 丹道修炼者
- 青松山主人

**外貌特征**：
- 身材：中等身材，仙风道骨
- 五官：面容和蔼，须发皆白，眼神深邃
- 皮肤：虽有皱纹但精神矍铄
- 穿着：青色道袍，朴素干净，仙气十足
- 气质：温和慈祥，德高望重，宗师风范

**背景故事**：
- **修炼历程**：五灵根出身（与高平阳相似），苦修百年到金丹期
- **收徒理念**：不以资质取人，看重品格和努力
- **弟子众多**：门下弟子数十人，于田、姜紫、赵长河、许阳、高平阳等
- **丹道造诣**：修炼丹道，在宗门内颇有声望
- **现状**：金丹中期，正在冲击金丹后期

---

## 性格特点

### 核心特质（5个关键词）

1. **温和慈祥**（外在表现）
   - 对弟子温和慈祥，如父亲般关爱
   - 说话语气温和，不急不躁
   - 笑容常挂脸上，让人如沐春风
   - "为师"、"师尊"的称呼让人尊敬

2. **慧眼识珠**（核心能力）
   - 能识别真正有潜力的人
   - 不以资质取人，看重品格和努力
   - 看中高平阳的稳健和努力，破格收徒
   - "此子稳健，必成大器"

3. **护短心强**（内在特点）
   - 对弟子极度护短
   - "我的弟子，只有我能教训"
   - 为弟子不惜与同辈翻脸
   - 温和外表下的强硬一面

4. **德高望重**（社会地位）
   - 在宗门内德高望重
   - 说话有分量，受人尊敬
   - 处事公正，不偏不倚
   - 弟子们爱戴和尊敬

5. **严师慈父**（教育方式）
   - 对弟子严格要求
   - 但又慈祥关爱
   - "严师出高徒，慈父育英才"
   - 平衡严厉和慈爱

### 优点

1. **慧眼识人**：能识别真正有潜力的人，不唯资质论
2. **护短心强**：对弟子极度护短，让人安心
3. **温和慈祥**：对弟子如慈父，让人温暖
4. **公正无私**：处事公正，不偏不倚
5. **德高望重**：在宗门内威望高，受人尊敬

### 弱点

1. **过于护短**：护短过度可能招来非议
2. **期望过高**：对弟子期望高，有时压力过大
3. **闭关时间长**：经常闭关修炼，与弟子相处时间有限
4. **年龄差距**：年龄太大，与弟子有代沟
5. **严厉时吓人**：发怒时很严厉，弟子害怕

### 成长轨迹

**第1-10集：未出场**
- 尚未收高平阳为徒
- 高平阳在外门挣扎

**第11-30集：收徒**
- 注意到高平阳的潜力
- 破格收五灵根废柴为徒
- "此子稳健，必成大器"

**第31-50集：培养**
- 传授功法，给予资源
- 为高平阳提供筑基丹
- 观摩高平阳突破筑基
- 为徒弟骄傲

**第51-80集：护短**
- 宗门大战时为高平阳撑腰
- 为弟子不惜一切
- 见证高平阳成长到金丹期
- 为徒弟的成就感到骄傲

