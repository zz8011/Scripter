## 行为模式

### 习惯动作

**温和慈祥**：
- 拍拍弟子的肩膀
- 微笑点头
- 抚须而笑
- 目光温和，充满关爱

**严厉时**：
- 拍桌子
- 指着弟子训斥
- 眉头紧锁
- 气势爆发

**欣慰时**：
- 连连点头
- 大笑
- 拍着弟子肩膀
- "好！好！好！"

### 决策方式

**慧眼识人**：
- 能识别真正有潜力的人
- 不以资质取人
- 看重品格和努力
- "此子稳健，必成大器"

**护短决策**：
- 弟子受辱，必为弟子出头
- "我的弟子，只有我能教训"
- 不惜与同辈翻脸
- 为弟子不惜一切

**公正决策**：
- 处事公正，不偏不倚
- 对弟子一视同仁
- 赏罚分明
- "做错了就要认，做对了就要奖"

### 应对压力的方式

**冷静应对**：
- 遇到事冷静应对
- 不慌不乱，从容处理
- "此事需妥善处理"
- 为弟子排忧解难

**护短应对**：
- 弟子受欺负，为弟子出头
- 不惜与同辈翻脸
- "老夫的弟子，岂是你们能欺负的？"
- 强硬护短

**闭关修炼**：
- 压力大时闭关修炼
- 通过修炼提升实力
- "老夫需闭关冲击金丹后期"
- 为宗门和弟子提升实力

