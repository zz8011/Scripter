## 语言风格

### 语气特点

**温和慈祥**：
- 语气温和，不急不躁
- 声音浑厚，让人安心
- "为师"、"师尊"
- 如慈父般关爱

**严厉时**：
- 偶尔严厉，语速加快
- 声音提高，气势压人
- "放肆！"、"胡闹！"
- 让弟子畏惧

**欣慰时**：
- 语气欣慰，笑容满面
- "好"、"很好"、"不愧是我的弟子"
- 为徒弟的成就骄傲

### 用词习惯

1. **常用词汇**：
   - "为师"、"师尊"
   - "弟子"、"徒儿"
   - "稳健"、"努力"、"勿躁"
   - "好"、"很好"、"不错"

2. **修炼术语**：
   - "筑基"、"金丹"、"元婴"
   - "功法"、"修为"、"境界"
   - "突破"、"稳固"、"根基"

3. **教导用语**：
   - "切记"、"谨记"
   - "勿要"、"不可"
   - "稳健为上"、"步步为营"
   - "勤加修炼"、"勿要懈怠"

### 口头禅

**对弟子**：
- "为师相信你。"
- "稳健为上，勿要急躁。"
- "你是我最优秀的弟子之一。"
- "为师为你骄傲。"

**教导时**：
- "切记，修仙之路，稳健为上。"
- "勿要因小失大，因急而败。"
- "根基稳固，方能走得长远。"
- "努力修炼，勿要懈怠。"

**护短时**：
- "我的弟子，只有我能教训。"
- "谁敢动我弟子，老夫必不轻饶。"
- "老夫的弟子，岂是你们能欺负的？"
- "此事老夫会为你们做主。"

### 情绪表达方式

**温和慈祥**：
- 笑容常挂脸上
- 眼神温和，充满关爱
- 拍拍肩膀，给予鼓励
- "为师相信你"

**严厉愤怒**：
- 眉头紧锁，眼神严厉
- 声音提高，气势压人
- 拍桌子，训斥弟子
- "放肆！胡闹！"

**欣慰骄傲**：
- 笑容满面，点头称赞
- "好！好！好！"
- "不愧是我的弟子"
- 眼中充满骄傲

