## 人物总结

**许青松**是一个重要的配角：
- ✅ 温和慈祥，如慈父般
- ✅ 慧眼识珠，不以资质取人
- ✅ 护短心强，为弟子不惜一切
- ✅ 德高望重，受人尊敬
- ✅ 严师慈父，平衡严厉和慈爱

**角色定位**：
- 重要配角（第30-80集）
- 高平阳的师父
- 导师和保护者
- 代表"不以资质取人"的正宗门理念

**核心作用**：
- 收徒：破格收五灵根废柴为徒
- 培养：传授功法，给予资源
- 护短：为弟子撑腰，保护弟子
- 见证：见证主角成长，为徒弟骄傲

**观众定位**：
- 让人尊敬的师父形象
- 观众期待他多保护主角
- "师尊太好了！"
- "有这样的师尊真好！"

