## 与主角的关系

### 收徒（第11-30集）

**初识高平阳**：
- 在外门注意到高平阳
- 五灵根废柴但稳健努力
- "此子稳健，必成大器"
- 破格收为弟子

**收徒仪式**：
- "从今日起，你便是老夫的弟子。"
- "为师名许青松，你可唤师尊。"
- "为师定会将你培养成才。"
- 高平阳正式拜师

### 培养（第31-50集）

**传授功法**：
- 传授高级功法
- "此功法名为《青木长生诀》，适合稳健修炼。"
- 指导修炼要义
- 为徒弟的进步欣慰

**给予资源**：
- 提供灵石、丹药
- "为师为你准备了筑基丹。"
- "这些资源你拿去修炼。"
- 毫不吝啬

**观摩筑基**：
- 观摩高平阳筑基
- 在关键时刻护法
- 筑基成功后欣慰
- "好！好！好！不愧是我的弟子！"

### 护短（第51-80集）

**宗门大战**：
- 宗门大战时为高平阳撑腰
- "老夫的弟子，岂是你们能欺负的？"
- 不惜为弟子出手
- 强硬护短

**见证成长**：
- 见证高平阳突破金丹
- 为徒弟骄傲
- "你能有今日成就，为师很欣慰。"
- "你是最优秀的弟子之一"

### 核心互动场景

**场景1：收徒（第30集）**
- 许青松："你愿拜老夫为师？"
- 高平阳："弟子愿意！"
- 许青松微笑："好！从今日起，你便是老夫的弟子。"

**场景2：传授功法（第35集）**
- 许青松："此功法名为《青木长生诀》。"
- 高平阳："多谢师尊！"
- 许青松："稳健修炼，勿要急躁。"

**场景3：给予筑基丹（第50集）**
- 许青松："为师为你准备了筑基丹。"
- 高平阳跪拜："弟子叩谢师尊！"
- 许青松扶起他："去吧，稳健筑基。"

**场景4：观摩筑基（第51集）**
- 许青松在旁护法
- 高平阳筑基成功
- 许青松欣慰："好！好！好！不愧是我的弟子！"

**场景5：金丹期（第75集）**
- 高平阳突破金丹
- 许青松骄傲："你能有今日，为师很欣慰。"
- 高平阳："都是师尊教导有方。"
- 许青松抚须而笑："你是自己努力的成果。"

