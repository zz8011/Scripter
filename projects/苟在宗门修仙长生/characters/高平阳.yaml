## 核心台词

### 早期（练气期）

**对债主**：
- "林师兄，容弟子三思，此事还需从长计议。"
- "弟子明白，稳健为上，步步为营。"
- "还债之事，弟子自有分寸。"

**内心独白**：
- "这修仙世界，实力为尊。我五灵根废柴，唯有稳健苟道，方有一线生机。"
- "神秘金书，竟有如此神力。但我必须保密，绝不可让任何人知晓。"
- "林铁河欺人太甚。但我不急，来日方长，待我实力足够，必斩草除根。"

**对师兄师姐**：
- "师兄/师姐教训的是，弟子谨记。"
- "多谢师兄/师姐指点，弟子受教了。"
- "弟子还需谨慎行事。"

### 中期（筑基期）

**对敌人**：
- "既然你们找死，那就怪不得我了。斩草除根，不留后患！"
- "林家欺我太甚，今日灭你满门，血债血偿！"
- "稳健修行，不代表我不会杀人。该出手时，我绝不手软。"

**内心独白**：
- "筑基成功，寿元两百年。但这只是开始，金丹、元婴，大道可期。"
- "林家灭门，斩草除根。修仙路上，不能有妇人之仁。"
- "稳健苟道，步步为营。我终将登上仙道之巅。"

**对宗门**：
- "弟子愿为宗门效力，但还需稳健行事。"
- "多谢师尊栽培，弟子必不负厚望。"
- "大道可期，长生久视。"

### 后期（金丹、元婴期）

**对晚辈**：
- "修仙之路，稳健为上。切不可急功近利，否则必有灾祸。"
- "步步为营，方能长久。藏锋守拙，才是大道。"
- "长生久视，需要的是耐心和稳健。"

**内心独白**：
- "从五灵根废柴到元婴老祖，我用了百年时光。稳健苟道，终成正果。"
- "回首往事，那些曾经的敌人，早已化为尘土。唯我道长青，万古如一。"
- "大道可期，长生久视。但元婴之上，还有化神、炼虚……修仙之路，永无止境。"

**对敌人**：
- "你找死？那就成全你。"
- "杀你，如屠狗耳。"
- "长生久视，需要斩断一切因果。你，不过是路上的绊脚石罢了。"

