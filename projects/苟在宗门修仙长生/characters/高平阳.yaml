## 语言风格

### 语气特点

**初期（练气期）**：
- 谦卑谨慎，不敢得罪人
- 说话留三分余地
- 常用"师兄"、"弟子明白"等敬语
- 语气温和，不张扬

**中期（筑基期）**：
- 沉稳冷静，不卑不亢
- 说话有分量，有威严
- 语气平和但有力量
- 该强硬时强硬

**后期（金丹、元婴期）**：
- 仙风道骨，从容淡定
- 说话简洁，字字珠玑
- 语气平和，不怒自威
- 高深莫测，让人敬畏

### 用词习惯

1. **常用词汇**：
   - "稳健"、"谨慎"、"步步为营"
   - "利益"、"权衡"、"划算"
   - "斩草除根"、"不留后患"
   - "大道"、"长生"、"修仙"

2. **修仙术语**：
   - "师兄"、"师弟"、"师尊"
   - "灵石"、"丹药"、"符箓"
   - "练气"、"筑基"、"金丹"、"元婴"
   - "灵根"、"修为"、"境界"

3. **谨慎表达**：
   - "或许"、"可能"、"也许"
   - "看来"、"似乎"、"应该"
   - 语气不确定，给自己留余地

### 口头禅

**初期**：
- "弟子明白"
- "师兄说得对"
- "容弟子三思"
- "还需谨慎"

**中期**：
- "看来只能如此了"
- "此事还需从长计议"
- "稳健为上"
- "斩草除根"

**后期**：
- "大道可期"
- "长生久视"
- "稳健修行"
- "顺其自然"

### 情绪表达方式

**克制隐忍**：
- 极少表露真实情绪
- 即使愤怒也面不改色
- 高兴时只是微微一笑
- 悲伤时独自承受

**内心独白**：
- 大量内心思考和权衡
- OS内心独白多
- 表面平静，内心波澜
- 思考利益得失

---

## 行为模式

### 习惯动作

**初期**：
- 低头行礼，谦卑有礼
- 谨慎观察四周
- 遇到事情先思考，不轻易表态
- 微笑示人，不表露真实想法

**中期**：
- 抚须沉思，权衡利弊
- 节奏缓慢，从容不迫
- 该出手时果断决绝
- 面带微笑，眼神冷厉

**后期**：
- 闭目养神，仙风道骨
- 举手投足间有威严
- 谈笑间决定生死
- 一言九鼎，不怒自威

### 决策方式

**三思而后行**：
- 决策前充分收集信息
- 权衡利弊，计算风险
- 准备多个备选方案
- 留好后手，应对意外

**利益优先**：
- 一切以修仙利益为重
- 不为情感所动
- 该牺牲时果断牺牲
- 长期利益高于短期利益

**稳健为上**：
- 不冒险，不赌博
- 稳扎稳打，步步为营
- 宁可慢一点，也要稳一点
- 不走极端，保持平衡

### 应对压力的方式

**冷静分析**：
- 遇到危机先冷静
- 分析局势，找到破局点
- 制定应对策略
- 逐步化解危机

**寻找机会**：
- 危机中寻找机会
- 化危为机
- 借力打力
- 反客为主

**暗中准备**：
- 表面平静，暗中准备
- 积累实力，等待时机
- 不轻举妄动
- 一击必杀

