- "别哭，哥替你报仇。"
- "那些欺负你的人，哥一个都不会放过。"
- "你是我的弟弟，谁敢欺负你，就是跟我过不去。"

**失败后**：
- "对不起，弟……哥给你丢脸了……"
- "哥……哥没本事……"
