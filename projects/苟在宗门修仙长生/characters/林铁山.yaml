- "我要将你碎尸万段！"

### 对高平阳（外门大比）

**轻敌**：
- "就凭你？也配跟我打？"
- "我让你三招！"
- "好好看着，什么叫练气大圆满的实力！"
- "五灵根废柴，我也太看得起你了。"

