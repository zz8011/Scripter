# 角色小传：林铁河

## 基本信息

**姓名**：林铁河

**年龄**：35岁

**身份**：
- 外门弟子（练气五层）
- 高利贷债主
- 外门十大弟子林铁山的弟弟
- 专门做灵石借贷生意

**外貌特征**：
- 身材：肥胖，满面红光（长期养尊处优）
- 五官：圆脸，小眼睛，笑容虚伪
- 穿着：青衫，但布料比普通外门弟子好
- 气质：市侩、贪婪、阴险
- 神态：常带笑容，但眼神冰冷

**背景故事**：
- **家族背景**：林家在外门有一定势力，兄长林铁山是外门十大弟子之一
- **修炼资质**：四灵根（伪灵根），比五灵根稍好，但仍是废柴
- **发家史**：靠兄长林铁山的势，做灵石借贷生意，剥削外门弟子
- **经营模式**：专找突破失败、根基受损的弟子放贷，高利息剥削
- **现状**：手中有数十个像高平阳这样的"债务人"，长期收割灵石

---

## 性格特点

### 核心特质（5个关键词）

1. **贪婪狡诈**（核心）
   - 唯利是图，一切向钱看
   - 狡猾多诈，设局坑人
   - 永不满足，越多越好
   - 为了利益不择手段

2. **阴险毒辣**（行事风格）
   - 笑里藏刀，口蜜腹剑
   - 背后下黑手，不择手段
   - 设计陷阱，让人无法反抗
   - 利用规则合法剥削

3. **欺软怕硬**（处世哲学）
   - 专挑弱者欺负
   - 遇到强者就认怂
   - 有靠山就嚣张
   - 失去靠山就怂了

4. **虚伪狡辩**（社交手段）
   - 表面客气，背后阴人
   - 说话好听，做事狠毒
   - 善于伪装成好人
   - 满口仁义道德，实则男盗女娼

5. **短视愚蠢**（致命弱点）
   - 只看眼前利益，不考虑长远
   - 自以为聪明，实则愚蠢
   - 小聪明多，大智慧少
   - 贪婪过度，最终自食恶果

### 优点

1. **精明算计**：在借贷生意上确实有一套，利息设置精准
2. **识人眼光**：能准确判断哪些人可以欺负，哪些人不能惹
3. **执行力**：设局陷害时执行力强，不手软
4. **伪装能力**：善于伪装成好人，让人放松警惕

### 弱点

1. **过度贪婪**：贪婪让他失去理智，最终反被高平阳算计
2. **欺软怕硬**：失去靠山后，立刻怂了，没有任何骨气
3. **短视**：只看眼前利益，不考虑长远后果
4. **自大**：有兄长撑腰就目中无人，看不起五灵根废柴
5. **愚蠢**：小聪明多，但大智慧少，最终被高平阳反杀

### 成长轨迹（反方向）

**第1-10集：嚣张跋扈**
- 作为债主，对高平阳耀武扬威
- 逼迫签下高利贷契约
- 笑里藏刀，表面客气实则阴险
- 自以为掌控一切，高平阳逃不出手掌心

**第11-30集：逐渐忌惮**
- 发现高平阳实力提升，生意越来越好
- 试图提高利息，进一步压榨
- 派人破坏高平阳的灵田，但失败
- 开始忌惮高平阳，但仍然不服

**第31-50集：设局陷害**
- 联合兄长林铁山，设局陷害高平阳
- 栽赃高平阳"偷窃宗门灵药"
- 结果被高平阳反诬陷，拿出证据
- 被罚100块灵石，贬为杂役弟子

