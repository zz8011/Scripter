## 核心台词

### 对高平阳（初期压迫）

**初次讨债**：
- "高师弟，多日不见，别来无恙啊！"
- "既然师弟已突破，那宗门的奖赏……想必已经到手了吧？"
- "师弟的难处，师兄明白。"
- "只要你将法力打入这张契约，还款之事，自然还可宽限些时日。"

**逼迫签契约**：
- "师弟啊，师兄这也是为了你好。细水长流嘛，师兄又不急。"
- "你看，这契约很公平。本金13块，年息1块，持续20年。"
- "师弟应该明白，此事绝难善了。师兄也不希望事情闹到宗门那里。"
- "签了吧，师弟。好自为之。"

### 对高平阳（中期忌惮）

**发现高平阳崛起**：
- "师弟如今是练气五层了，了不起啊。"
- "师弟的符箓生意越来越好，师兄为你高兴。"
- "不过嘛，师兄觉得，这利息是不是可以涨一涨了？"
- "年息2块灵石，不过分吧？"

**威胁暗示**：
- "师弟应该知道，在外门混，光有实力是不够的。"
- "师兄我这个人，最讲道理。但师弟如果不讲道理，那就不怪师兄不客气了。"
- "师弟应该明白我的意思。"
- "好自为之，师弟。"

### 对高平阳（后期设局）

**栽赃陷害**：
- "高平阳，你偷窃宗门灵药，人赃并获！"
- "还敢狡辩？证据确凿！"
- "跟我去外门执事堂，接受惩罚！"
- "哈哈哈，高平阳，你完了！"

**被反诬陷后**：
- "这……这不可能！这是陷害！"
- "师弟……师弟饶命！"
- "我……我只是听命行事……"
- "师兄……师兄救我……"

### 对兄长林铁山

**求助**：
- "兄长，那高平阳太嚣张了！"
- "兄长一定要为弟弟做主啊！"
- "那小子不把我放在眼里，简直欺人太甚！"
- "兄长，一定要教训他！"

**失败后**：
- "兄长……对不起……弟弟给你丢脸了……"
- "兄长……弟弟被贬为杂役了……"
- "兄长……以后不能再跟兄长一起风光了……"
- "兄长……弟弟对不起你……"

### 对其他债务人

**放贷时**：
- "师弟啊，需要灵石吗？师兄可以借给你。"
- "利息好商量，师兄最讲道理。"
- "签个契约就行，很简单。"
- "师兄会照顾你的。"

**讨债时**：
- "师弟，到了还款的日子了。"
- "利息别忘了，年息1块。"
- "师兄也不想把事情闹大。"
- "好自为之。"

