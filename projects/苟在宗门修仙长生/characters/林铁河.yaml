## 人物总结

**林铁河**是一个典型的反派角色：
- ❌ 贪婪狡诈，唯利是图
- ❌ 阴险毒辣，笑里藏刀
- ❌ 欺软怕硬，有靠山就嚣张
- ❌ 虚伪狡辩，表面客气背后阴人
- ❌ 短视愚蠢，贪婪过度自食恶果

**反派定位**：
- 初期反派（第1-30集）
- 主角的第一个大敌
- 代表外门的压迫和不公
- 被主角反杀，打脸爽感十足

**核心作用**：
- 制造危机：高利贷债务，给主角压力
- 推动剧情：逼迫主角成长和反击
- 提供爽感：主角反杀林铁河，打脸反派
- 体现主题：稳健苟道，斩草除根

**观众定位**：
- 让人痛恨的反派
- 观众期待被打脸
- 反杀时的爽感来源

