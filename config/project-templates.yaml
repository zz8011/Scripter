# =============================================================================
# Scripter - 项目模板配置
# =============================================================================
# 用途：预设不同类型短剧项目的配置模板
# 使用：新建项目时可选择模板，自动应用配置
# =============================================================================

templates:
  # =============================================================================
  # 微短剧模板（1-2分钟/集）
  # 适用：抖音、快手、竖屏短剧
  # =============================================================================
  micro_short_drama:
    name: "微短剧模板"
    description: "1-2分钟/集，快节奏，竖屏优化"
    version: "1.0"

    # 项目类型
    type: "短剧"
    sub_type: "微短剧"

    # 集数配置
    episodes:
      min: 80
      max: 100
      recommended: 80
      current: 1

    # 时长配置
    duration:
      per_episode: 120          # 单集2分钟
      tolerance: 15             # ±15秒
      min_per_episode: 105
      max_per_episode: 135

    # 场景配置
    scenes:
      per_episode_range: [3, 5]    # 每集3-5场
      target_scene_duration: 30    # 目标30秒/场
      min_scene_duration: 15       # 最少15秒
      max_scene_duration: 50       # 最多50秒

    # 字数配置（用于时长估算）
    word_count:
      words_per_minute: 320        # 每分钟320字（语速较快）
      dialogue_speed: 5.5          # 对话：5.5字/秒
      description_speed: 4.0       # 描述：4字/秒
      os_speed: 4.5                # OS：4.5字/秒

    # 节奏配置
    pacing:
      hook_seconds: 3              # 前3秒必须抓住观众
      opening_scene_ratio: 0.25    # 开场占1/4
      climax_position: 0.70        # 高潮在70%位置
      cliff_hanger_position: 0.92  # 悬念在92%位置

      # 节奏要求
      requirements:
        - "前3秒必须有强烈冲突或悬念"
        - "每30秒至少一个转折点"
        - "对话节奏快，避免长段独白"
        - "动作戏份占比≥40%"
        - "最后8秒必须留悬念"

    # 角色配置
    characters:
      main_cast_count: 2           # 2个主角
      supporting_cast_max: 3       # 最多3个配角
      per_scene_characters: 2-3    # 每场2-3个角色

    # 创作约束
    constraints:
      max_continuous_dialogue: 8   # 最长8轮对话
      min_action_breaks: 3         # 至少3个动作间隔
      emotional_arc: "required"    # 必须有情感曲线
      quick_pacing: true           # 快节奏

    # 适用场景
    use_cases:
      - "抖音快手"
      - "竖屏短剧"
      - "快节奏爽剧"
      - "移动端观看"

    # 推荐标签
    tags: ["微短剧", "快节奏", "竖屏", "爽文"]

  # =============================================================================
  # 短剧模板（3-5分钟/集）
  # 适用：腾讯视频、优酷、中长视频
  # =============================================================================
  short_drama:
    name: "短剧模板"
    description: "3-5分钟/集，平衡节奏，情感戏丰富"
    version: "1.0"

    type: "短剧"
    sub_type: "标准短剧"

    episodes:
      min: 40
      max: 60
      recommended: 50
      current: 1

    duration:
      per_episode: 240          # 单集4分钟
      tolerance: 20             # ±20秒
      min_per_episode: 220
      max_per_episode: 260

    scenes:
      per_episode_range: [5, 8]
      target_scene_duration: 40
      min_scene_duration: 20
      max_scene_duration: 60

    word_count:
      words_per_minute: 300
      dialogue_speed: 5.0
      description_speed: 3.5
      os_speed: 4.0

    pacing:
      hook_seconds: 10           # 前10秒铺垫，20秒出现冲突
      opening_scene_ratio: 0.30
      climax_position: 0.75
      cliff_hanger_position: 0.95

      requirements:
        - "前10秒铺垫氛围"
        - "每40秒一个转折点"
        - "可以有较长的情感戏"
        - "对话和动作平衡"
        - "结尾可以悬念或情感升华"

    characters:
      main_cast_count: 2
      supporting_cast_max: 5
      per_scene_characters: 2-4

    constraints:
      max_continuous_dialogue: 12
      min_action_breaks: 2
      emotional_arc: "required"
      quick_pacing: false

    use_cases:
      - "腾讯视频"
      - "优酷"
      - "中长视频"
      - "横屏观看"

    tags: ["短剧", "情感", "中篇", "横屏"]

  # =============================================================================
  # 迷你剧模板（8-10分钟/集）
  # 适用：爱奇艺、芒果TV、精品短剧
  # =============================================================================
  mini_drama:
    name: "迷你剧模板"
    description: "8-10分钟/集，完整故事线，制作精良"
    version: "1.0"

    type: "短剧"
    sub_type: "迷你剧"

    episodes:
      min: 20
      max: 30
      recommended: 24
      current: 1

    duration:
      per_episode: 600          # 单集10分钟
      tolerance: 30             # ±30秒
      min_per_episode: 570
      max_per_episode: 630

    scenes:
      per_episode_range: [8, 12]
      target_scene_duration: 60
      min_scene_duration: 30
      max_scene_duration: 120

    word_count:
      words_per_minute: 280
      dialogue_speed: 4.5
      description_speed: 3.0
      os_speed: 3.5

    pacing:
      hook_seconds: 30          # 前30秒铺垫氛围
      opening_scene_ratio: 0.35
      climax_position: 0.80
      cliff_hanger_position: 0.95

      requirements:
        - "前30秒铺垫氛围和人物"
        - "每60秒一个转折点"
        - "可以有完整的故事线"
        - "情感戏可以充分展开"
        - "结尾可以是大团圆或开放式"

    characters:
      main_cast_count: 2-3
      supporting_cast_max: 8
      per_scene_characters: 2-5

    constraints:
      max_continuous_dialogue: 15
      min_action_breaks: 2
      emotional_arc: "required"
      quick_pacing: false

    use_cases:
      - "爱奇艺"
      - "芒果TV"
      - "精品短剧"
      - "电视播出"

    tags: ["迷你剧", "精品", "长篇", "电视"]

