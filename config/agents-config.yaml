# =============================================================================
# Scripter - Claude Code Agent 配置文件
# =============================================================================
# 用途：配置用于开发剧灵应用的 Claude Code Agents
# 版本：2.0
# 更新：2026-01-24
# =============================================================================

# =============================================================================
# 开发 Agents（用于开发剧灵应用本身）
# =============================================================================
agents:
  # =============================================================================
  # 前端开发 Agent
  # =============================================================================
  frontend:
    name: "Frontend Developer"
    description: "Next.js + React + TypeScript + Tailwind CSS 专家"

    expertise:
      - "Next.js 14+ App Router"
      - "React 18+ Hooks 和并发特性"
      - "TypeScript 类型系统"
      - "Tailwind CSS 响应式设计"
      - "shadcn/ui 组件库"
      - "TipTap 富文本编辑器"

    responsibilities:
      - "实现页面和组件"
      - "状态管理"
      - "路由配置"
      - "UI 交互"
      - "性能优化"

    context_requirements:
      - "docs/design/.claude/design-context.md"
      - "docs/tech/component-conventions.md"

    default_model: "claude-sonnet-4-5"

  # =============================================================================
  # 后端开发 Agent
  # =============================================================================
  backend:
    name: "Backend Developer"
    description: "Next.js API + Drizzle ORM + PostgreSQL 专家"

    expertise:
      - "Next.js API Routes"
      - "Drizzle ORM"
      - "PostgreSQL 查询优化"
      - "RESTful API 设计"
      - "JWT 认证"
      - "Casdoor 集成"

    responsibilities:
      - "实现 API 端点"
      - "数据库操作"
      - "认证授权"
      - "数据验证"
      - "错误处理"

    context_requirements:
      - "docs/tech/api-spec.md"
      - "docs/tech/tech-design.md"

    default_model: "claude-sonnet-4-5"

  # =============================================================================
  # AI 集成 Agent
  # =============================================================================
  ai_integration:
    name: "AI Integration Specialist"
    description: "GLM-4.7 + T8Star API 集成专家"

    expertise:
      - "智谱 GLM-4.7 API"
      - "T8Star 图片生成 API"
      - "流式响应处理"
      - "提示词工程"
      - "上下文管理"
      - "错误重试"

    responsibilities:
      - "集成 AI API"
      - "实现流式响应"
      - "优化提示词"
      - "管理 Token 使用"
      - "处理 AI 错误"

    context_requirements:
      - "config/model-config.yaml"
      - "docs/tech/ai-integration.md"

    default_model: "claude-opus-4-5"

  # =============================================================================
  # 数据库 Agent
  # =============================================================================
  database:
    name: "Database Specialist"
    description: "Drizzle ORM + PostgreSQL 数据建模专家"

    expertise:
      - "Drizzle ORM Schema"
      - "PostgreSQL 索引优化"
      - "数据迁移"
      - "关系设计"
      - "查询优化"
      - "备份策略"

    responsibilities:
      - "设计数据模型"
      - "编写迁移"
      - "优化查询"
      - "数据库测试"

    context_requirements:
      - "docs/tech/tech-design.md"

    default_model: "claude-sonnet-4-5"

  # =============================================================================
  # 测试 Agent
  # =============================================================================
  testing:
    name: "QA Engineer"
    description: "Jest + Testing Library 测试专家"

    expertise:
      - "Jest 测试框架"
      - "React Testing Library"
      - "API 测试"
      - "E2E 测试"
      - "覆盖率分析"
      - "TDD 方法"

    responsibilities:
      - "编写单元测试"
      - "编写集成测试"
      - "测试覆盖率"
      - "自动化测试"

    context_requirements:
      - "docs/tech/testing.md"

    default_model: "claude-sonnet-4-5"

  # =============================================================================
  # DevOps Agent
  # =============================================================================
  devops:
    name: "DevOps Engineer"
    description: "部署、CI/CD、监控专家"

    expertise:
      - "Vercel 部署"
      - "GitHub Actions"
      - "Docker 容器化"
      - "环境变量管理"
      - "性能监控"
      - "日志管理"

    responsibilities:
      - "配置部署"
      - "设置 CI/CD"
      - "环境配置"
      - "性能优化"

    context_requirements:
      - "config/dev-config.yaml"

    default_model: "claude-sonnet-4-5"

# =============================================================================
# Agent 协作流程
# =============================================================================
workflows:
  # 新功能开发流程
  feature_development:
    steps:
      - agent: "frontend"
        task: "创建 UI 组件"

      - agent: "backend"
        task: "实现 API 端点"

      - agent: "ai_integration"
        task: "集成 AI 功能（如需要）"

      - agent: "testing"
        task: "编写测试"

      - agent: "code_reviewer"
        task: "代码审查"

  # Bug 修复流程
  bug_fix:
    steps:
      - agent: "systematic-debugging"
        task: "诊断问题"

      - agent: "frontend|backend"
        task: "修复问题"

      - agent: "testing"
        task: "验证修复"

  # 性能优化流程
  performance_optimization:
    steps:
      - agent: "code-reviewer"
        task: "分析代码"

      - agent: "frontend|backend"
        task: "实施优化"

      - agent: "testing"
        task: "性能测试"

# =============================================================================
# 并行执行配置
# =============================================================================
parallel:
  # 最大并行 Agent 数
  max_agents: 3

  # Agent 组（可并行执行）
  groups:
    independent_features:
      - "frontend"
      - "backend"
      - "database"

    full_stack:
      - "frontend"
      - "backend"
      - "ai_integration"

    testing:
      - "testing"
      - "code_reviewer"

# =============================================================================
# 技能映射
# =============================================================================
skills:
  # superpowers 技能
  brainstorming:
    agent: "all"
    trigger: "功能规划、设计讨论"

  test_driven_development:
    agent: "frontend|backend"
    trigger: "使用 /tdd 命令"

  systematic_debugging:
    agent: "all"
    trigger: "遇到 Bug、测试失败"

  verification_before_completion:
    agent: "all"
    trigger: "任务完成、提交前"

  writing_plans:
    agent: "all"
    trigger: "使用 /plan 命令"

  # everything-claude-code 技能
  tdd_workflow:
    agent: "frontend|backend|testing"
    trigger: "TDD 开发"

  frontend_patterns:
    agent: "frontend"
    trigger: "React/Next.js 组件开发"

  backend_patterns:
    agent: "backend"
    trigger: "API/数据库开发"

  security_review:
    agent: "backend"
    trigger: "涉及安全、认证"

# =============================================================================
# 上下文策略
# =============================================================================
context_strategy:
  # 全局上下文（始终加载）
  global:
    - "README.md"
    - "config/dev-config.yaml"

  # 项目上下文（按需加载）
  project:
    frontend:
      - "docs/design/.claude/design-context.md"
      - "docs/tech/component-conventions.md"

    backend:
      - "docs/tech/api-spec.md"
      - "docs/tech/tech-design.md"

    ai:
      - "config/model-config.yaml"
      - "docs/tech/ai-integration.md"

  # 任务上下文（动态加载）
  task:
    - "相关源代码文件"
    - "相关测试文件"
    - "相关文档"

# =============================================================================
# 输出规范
# =============================================================================
output_standards:
  code:
    language: "TypeScript"
    style: "ESLint + Prettier"
    comments: "JSDoc"

  commits:
    format: "conventional"
    types:
      - "feat"
      - "fix"
      - "refactor"
      - "style"
      - "docs"
      - "test"
      - "chore"

  pull_requests:
    template: ".github/PULL_REQUEST_TEMPLATE.md"
    required_checks:
      - "tests"
      - "lint"
      - "build"
      - "code-review"

# =============================================================================
# 配置版本
# =============================================================================
config_version: "2.0.0"
last_updated: "2026-01-24"
maintainer: "Scripter Team"
